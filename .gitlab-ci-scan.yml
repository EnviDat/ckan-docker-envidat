
.scan:
  stage: scan
  image:
    name: docker.io/aquasec/trivy:0.65.0
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - trivy --version
    - trivy clean --scan-cache
    - time trivy --cache-dir .trivycache/ image --download-db-only --no-progress
    # Single scan → JSON only
    - |
      echo "🔍 Scanning image ${IMAGE_NAME}-unverified ..."
      trivy --cache-dir .trivycache/ image \
        --ignore-unfixed \
        --no-progress \
        --format json \
        "${IMAGE_NAME}-unverified" \
        --output "$CI_PROJECT_DIR/$SHORT_NAME-imgscan.json" \
      | tee "$CI_PROJECT_DIR/$SHORT_NAME-imgscan.log"


    # Convert JSON to GitLab template format (if you still want GitLab Security Dashboard integration)
    - trivy convert --format template --template "@/contrib/gitlab.tpl" \
        --output "$CI_PROJECT_DIR/$SHORT_NAME-imgscan.gitlab.json" \
        "$CI_PROJECT_DIR/$SHORT_NAME-imgscan.json"

    # Fail job if CRITICAL fixable vulns are found (no re-scan, just parse JSON)
    - |
      echo "🔎 Checking for CRITICAL vulnerabilities..."
      if jq -e '.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL")' \
            "$CI_PROJECT_DIR/$SHORT_NAME-imgscan.json" > /dev/null; then
        echo "❌ CRITICAL vulnerabilities found!"
        exit 1
      else
        echo "✅ No CRITICAL vulnerabilities found."
      fi
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
    policy: pull-push
  artifacts:
    when: always
    reports:
      container_scanning: $SHORT_NAME-imgscan.json
    paths:
      - $SHORT_NAME-imgscan.log

ckan-scan:
  needs:
    - set-vars
    - ckan-build
  extends:
    - .triggers    
    - .scan
  variables:
    IMAGE_NAME: ${CKAN_IMAGE}
    SHORT_NAME: "ckan"

proxy-scan:
  needs:
    - set-vars
    - proxy-build
  extends:
    - .triggers    
    - .scan
  variables:
    IMAGE_NAME: ${PROXY_IMAGE}
    SHORT_NAME: "proxy"
