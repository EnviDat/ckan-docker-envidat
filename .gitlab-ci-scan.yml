
.scan:
  stage: scan
  image:
    name: docker.io/aquasec/trivy:0.65.0
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - trivy --version
    - time trivy image --clear-cache
    - time trivy --cache-dir .trivycache/ image --download-db-only --no-progress
    # Run scan once, produce both GitLab JSON + human-readable output
    - |
      echo "🔍 Scanning image ${IMAGE_NAME}-unverified ..."
      trivy --cache-dir .trivycache/ image \
        --ignore-unfixed \
        --no-progress \
        --format template --template "@/contrib/gitlab.tpl" \
        --output "$CI_PROJECT_DIR/$SHORT_NAME-imgscan.json" \
        "${IMAGE_NAME}-unverified" \
        | tee "$CI_PROJECT_DIR/$SHORT_NAME-imgscan.log"

    # Fail job if CRITICAL fixable vulns are found (without re-scan)
    - |
      echo "🔎 Checking for CRITICAL vulnerabilities..."
      trivy --cache-dir .trivycache/ image \
        --ignore-unfixed \
        --severity CRITICAL \
        --exit-code 1 \
        --no-progress \
        "${IMAGE_NAME}-unverified"
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
    policy: pull-push
  artifacts:
    when: always
    reports:
      container_scanning: $SHORT_NAME-imgscan.json
    paths:
      - $SHORT_NAME-imgscan.log

ckan-scan:
  needs:
    - set-vars
    - ckan-build
  extends:
    - .triggers    
    - .scan
  variables:
    IMAGE_NAME: ${CKAN_IMAGE}
    SHORT_NAME: "ckan"

proxy-scan:
  needs:
    - set-vars
    - proxy-build
  extends:
    - .triggers    
    - .scan
  variables:
    IMAGE_NAME: ${PROXY_IMAGE}
    SHORT_NAME: "proxy"
