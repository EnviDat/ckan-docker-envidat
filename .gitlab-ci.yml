include:
  - local: '.gitlab-ci-scan.yml'
  - local: '.gitlab-ci-package.yml'

stages:
  - build
  - scan
  - package
  - deploy
  - release
  - manual-deploy

default:  
  tags:
    - backend

variables:
  ARTIFACT_COMPRESSION_LEVEL: "fast" ## check if required
  CACHE_COMPRESSION_LEVEL: "fast" ## check if required

.triggers:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "staging"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

set-vars:
  stage: .pre
  environment: $CI_COMMIT_REF_NAME
  image: docker.io/alpine:3.20
  script: #check if echo can be used once to extract strings
    - echo "$CKAN_ENV" | grep '^CKAN_VERSION=' >> build.env
    - echo "$CKAN_ENV" | grep '^NGINX_PORT_HOST=' >> build.env
    - echo "$CKAN_ENV" | grep '^NGINX_PORT=' >> build.env
    - echo "$CKAN_ENV" | grep '^SOLR_IMAGE_VERSION=' >> build.env
    - echo "$CKAN_ENV" | grep '^REDIS_VERSION=' >> build.env
    - echo "$CKAN_ENV" | grep '^TZ=' >> build.env
    - . build.env
    - "echo APP_NAME=ckan-${CI_COMMIT_REF_NAME} >> build.env"
    - "echo CKAN_IMAGE=${INTERNAL_REG}/ckan-docker-envidat/ckan:\
      ${CKAN_VERSION}-${CI_COMMIT_REF_NAME} >> build.env"
    - "echo PROXY_IMAGE=${INTERNAL_REG}/ckan-docker-envidat/proxy:\
      nginx-${CI_COMMIT_REF_NAME} >> build.env"
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env

#create document to setup dind runner
.build:
  stage: build
  image: docker:24.0.5
  needs:
    - set-vars
  services:
    - name: docker:24.0.5-dind
      pull_policy: if-not-present
      # the following setting is for tls disabled
      #command: ["--tls=false"]
      # the following setting is for tls enabled
      command: ["--tls=true", "--host=tcp://0.0.0.0:2376"]
  variables:
    DOCKER_AUTH_CONFIG: $DOCKER_AUTH_CONFIG
    # the following settings are for tls disabled
    #DOCKER_HOST: tcp://docker:2375
    #DOCKER_TLS_CERTDIR: ""
    # the following settings are for tls enabled
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    DOCKER_TLS_VERIFY: "1"
  tags:
    - dind
  before_script:
    - echo "Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - mkdir -p ~/.docker
    - echo "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json
    - docker info
  script:
    - echo "CKAN_VERSION=$CKAN_VERSION"
    - echo "CKAN_IMAGE=$CKAN_IMAGE"
    - echo "CONTEXT_DIR=$CONTEXT_DIR"
    - docker build -t "${IMAGE_NAME}-unverified" -f "${CONTEXT_DIR}/Dockerfile" "${CONTEXT_DIR}"
    - docker push "${IMAGE_NAME}-unverified"

.build-rootless:
  image: 
    name: moby/buildkit:rootless
    entrypoint: [""]
  stage: build
  needs:
    - set-vars
  variables:
    DOCKER_BUILDKIT: 1
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
    CACHE_IMAGE: $CI_REGISTRY_IMAGE:cache
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"    
  tags:
    - rootless
  before_script:
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
  script:
    - echo "Going to build ${IMAGE_NAME}"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=${CONTEXT_DIR} \
        --local dockerfile=${CONTEXT_DIR} \
        --output type=image,name="${IMAGE_NAME}-unverified",push=true \
        --progress=plain

ckan-build:
  extends:
    - .triggers
    - .build-rootless
  variables:
    IMAGE_NAME: ${CKAN_IMAGE}
    CONTEXT_DIR: "${CI_PROJECT_DIR}/ckan"

proxy-build:
  extends:
    - .triggers
    - .build-rootless
  cache: # check if required
    key: nginx-config
    paths:
      - nginx/conf.d/ckan.conf.template
    policy: pull
  variables:
    IMAGE_NAME: ${PROXY_IMAGE}
    CONTEXT_DIR: "${CI_PROJECT_DIR}/nginx"

remote-docker:
  stage: deploy
  environment: $CI_COMMIT_REF_NAME
  image: docker.io/docker:24.0
  extends:
    - .triggers
  needs:
    - job: set-vars
      artifacts: true
    - ckan-retag
    - proxy-retag
  variables:
    #DOCKER_HOST: "ssh://$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME"
    USER_DIR: /home/$DEPLOY_SSH_USER
  before_script:
    - echo "***The app image is   ${IMAGE_NAME}"
    - echo "***The app version is  ${CKAN_VERSION}"
    - echo "Going to docker remote ($DEPLOY_HOSTNAME) with file docker-compose.yml"
    - echo "$CKAN_ENV" > .ckan.env
    - echo "Adding SSH Key"
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/gitlab
    - chmod 400 ~/.ssh/gitlab
    - echo 'IdentityFile ~/.ssh/gitlab' > ~/.ssh/config
    - echo "going to keyscan on HOST ${DEPLOY_HOSTNAME}"
    - ssh-keyscan -H $DEPLOY_HOSTNAME >> ~/.ssh/known_hosts
  #    - cat ~/.ssh/known_hosts
  script:
    # copying both docker-compose and .ckan.env to server to keep some redundancy
    - |
      ssh "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME" "mkdir -p $USER_DIR/config/ckan"
      scp .ckan.env "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME:$USER_DIR/config/ckan/.env"
      scp docker-compose.yml "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME:$USER_DIR/docker-compose.yml"
      scp build.env "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME:$USER_DIR/build.env"
    # use docker compose create to recreate the container and force pulling the latest image
    # to avoid using the local cache
    - |
      ssh "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME" "
        mkdir -p ~/.docker &&
        echo '${DOCKER_AUTH_CONFIG}' > ~/.docker/config.json &&
        cd $USER_DIR &&
        docker compose --project-name=$APP_NAME --env-file build.env pull &&
        docker compose --project-name=$APP_NAME --env-file build.env up -d --force-recreate &&
        rm build.env"

# Job for manual deploying of a docker-compose file, to use it's
# docker images, make sure before you run it that the images referenced
# in the docker-compose.$CI_COMMIT_REF_NAME.yml exist!
manual-remote-docker:
  stage: manual-deploy
  environment: $CI_COMMIT_REF_NAME
  image: docker.io/docker:24.0
  needs:
    - job: set-vars
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always
    - when: manual
  # for manaul jobs add allow_failure so the whole pipeline won't show up as "blocked"
  allow_failure: true    
  variables:
    #DOCKER_HOST: "ssh://$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME"
    USER_DIR: /home/$DEPLOY_SSH_USER
  before_script:
    - echo "***The app image is   ${IMAGE_NAME}"
    - echo "***The app version is  ${CKAN_VERSION}"
    - echo "Going to docker remote ($DEPLOY_HOSTNAME) with file docker-compose.yml"
    - echo "$CKAN_ENV" > .ckan.env
    - echo "Adding SSH Key"
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/gitlab
    - chmod 400 ~/.ssh/gitlab
    - echo 'IdentityFile ~/.ssh/gitlab' > ~/.ssh/config
    - echo "going to keyscan on HOST ${DEPLOY_HOSTNAME}"
    - ssh-keyscan -H $DEPLOY_HOSTNAME >> ~/.ssh/known_hosts
#    - cat ~/.ssh/known_hosts
  script:
    # copying both docker-compose and .ckan.env to server to keep some redundancy
    - |
      ssh "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME" "mkdir -p $USER_DIR/config/ckan"
      scp .ckan.env "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME:$USER_DIR/config/ckan/.env"
      scp docker-compose.yml "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME:$USER_DIR/docker-compose.yml"
      scp build.env "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME:$USER_DIR/build.env"
    # use docker compose create to recreate the container and force pulling the latest image
    # to avoid using the local cache
    - |
      ssh "$DEPLOY_SSH_USER@$DEPLOY_HOSTNAME" "
        mkdir -p ~/.docker &&
        echo '${DOCKER_AUTH_CONFIG}' > ~/.docker/config.json &&
        cd $USER_DIR &&
        docker compose --project-name=$APP_NAME --env-file build.env pull &&
        docker compose --project-name=$APP_NAME --env-file build.env up -d --force-recreate &&
        rm build.env"
