include:
  - local: '.gitlab-ci-scan.yml'
  - local: '.gitlab-ci-package.yml'

stages:
  - build
  - scan
  - package
  - deploy
  - release
  - manual-deploy

default:  
  tags:
    - backend

variables:
  ARTIFACT_COMPRESSION_LEVEL: "fast" ## check if required
  CACHE_COMPRESSION_LEVEL: "fast" ## check if required

.triggers:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "staging"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "dev"
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

set-vars:
  stage: .pre
  environment: $CI_COMMIT_REF_NAME
  image: docker.io/alpine:3.20
  script: #check if echo can be used once to extract strings
    - echo "$CKAN_ENV" | grep '^CKAN_VERSION=' >> build.env
    - echo "$CKAN_ENV" | grep '^NGINX_PORT_HOST=' >> build.env
    - echo "$CKAN_ENV" | grep '^NGINX_PORT=' >> build.env
    - echo "$CKAN_ENV" | grep '^SOLR_IMAGE_VERSION=' >> build.env
    - echo "$CKAN_ENV" | grep '^REDIS_VERSION=' >> build.env
    - echo "$CKAN_ENV" | grep '^TZ=' >> build.env
    - . build.env
    - "echo APP_NAME=ckan-${CI_COMMIT_REF_NAME} >> build.env"
    - "echo CKAN_IMAGE=${INTERNAL_REG}/ckan-docker-envidat/ckan:\
      ${CKAN_VERSION}-${CI_COMMIT_REF_NAME} >> build.env"
    - "echo PROXY_IMAGE=${INTERNAL_REG}/ckan-docker-envidat/proxy:\
      nginx-${CI_COMMIT_REF_NAME} >> build.env"
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env

#create document to setup dind runner
.build:
  stage: build
  image: docker:24.0.5
  needs:
    - set-vars
  services:
    - name: docker:24.0.5-dind
      #command: ["--tls=false"] # try to make it work with tls
  variables:
    #DOCKER_HOST: tcp://docker:2375
    #DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "unix:///runner/services/docker/docker.sock"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_AUTH_CONFIG: $DOCKER_AUTH_CONFIG
  tags:
    - dind
  before_script:
    - echo "Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - mkdir -p ~/.docker
    - echo "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json
    - docker info
  script:
    - echo "CKAN_VERSION=$CKAN_VERSION"
    - echo "CKAN_IMAGE=$CKAN_IMAGE"
    - echo "CONTEXT_DIR=$CONTEXT_DIR"
    - docker build -t "${IMAGE_NAME}-unverified" -f "${CONTEXT_DIR}/Dockerfile" "${CONTEXT_DIR}"
    - docker push "${IMAGE_NAME}-unverified"
    #- docker run my-docker-image /script/to/run/tests

build-rootless:
  image: moby/buildkit:rootless
  stage: build
  needs:
    - set-vars
  variables:
    CACHE_IMAGE: $CI_REGISTRY_IMAGE:cache
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"    
  before_script:
    - mkdir -p ~/.docker
    - echo "going to create kaniko config.json for auth for ${INTERNAL_REG} -> '${IMAGE_REGISTRY_USER}' and https://index.docker.io/v1/ -> '${DOCKER_USERNAME}'"
    - >
      echo "{\"auths\":{
      \"${INTERNAL_REG}\":{
        \"auth\":\"$(printf "%s:%s" "${IMAGE_REGISTRY_USER}" "${IMAGE_REGISTRY_PASS}" | base64 | tr -d '\n')\"
        },
        \"https://index.docker.io/v1/\":{
          \"auth\":\"$(printf "%s:%s" "${DOCKER_USERNAME}" "${DOCKER_TOKEN}" | base64 | tr -d '\n')\"
        }
      }}" > ~/.docker/config.json
  script:
    - echo "Going to build ${IMAGE_NAME}"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="${CI_PROJECT_DIR}/ckan-rootless" \
        --local dockerfile="$CI_PROJECT_DIR" \
        --opt filename=Dockerfile \
        --output type=image,name="${IMAGE_NAME}-unverified",push=true \
        --progress=plain

