volumes:
  ckan_storage:
  solr_data:
  pip_cache:
  site_packages:

services:

  nginx:
    image: "${PROXY_IMAGE}"
    build:
      context: nginx/
      dockerfile: Dockerfile
    networks:
      - webnet
      - ckannet
    environment:
      - AUTH_COOKIE_NAME=envidat
    depends_on:
      ckan:
        condition: service_healthy
    ports:
      #- "0.0.0.0:${NGINX_SSLPORT_HOST}:${NGINX_SSLPORT}"
      - "0.0.0.0:${NGINX_PORT_HOST}:${NGINX_PORT}"
    restart: unless-stopped
    
  ckan:
    image: "${CKAN_IMAGE}"
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    networks:
      - ckannet
      - solrnet
      - redisnet
    env_file:
      - .env  # this is the one CKAN reads
    depends_on:
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/lib/python3.10/site-packages
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://ckan:5000/api/action/status_show"]
      interval: 60s
      timeout: 10s
      retries: 3

  solr:
    networks:
      - solrnet
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://solr:8983/solr/"]

  redis:
    image: redis:${REDIS_VERSION}
    networks:
      - redisnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]

  ckan-worker: #needed to have queue work/have cron jobs
    image: "${CKAN_IMAGE}"
    command: ["ckan", "-c", "/srv/app/ckan.ini", "jobs", "worker"] #not sure if that works <.<
    env_file:
      - .env #same as ckan
    depends_on:
      - redis
    restart: unless-stopped
    volumes: #same as ckan
      - ckan_storage:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/lib/python3.10/site-packages

networks:
  webnet:
  ckannet:
  solrnet:
    internal: true
  redisnet:
    internal: true
